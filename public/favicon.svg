<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background Gradient: from-amber-300 via-amber-500 to-amber-600 -->
    <linearGradient id="amberGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fcd34d" />
      <stop offset="50%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>

    <!-- Outer Shadow for Badge -->
    <filter id="badgeShadow" x="-20%" y="-20%" width="140%" height="140%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#000000" flood-opacity="0.25" />
    </filter>
  </defs>

  <!-- Squircle Badge: 448x448, centered at (32, 32) -->
  <rect x="32" y="32" width="448" height="448" rx="168" ry="168" fill="url(#amberGrad)" filter="url(#badgeShadow)" />

  <!-- Heart Icon (Exact Lucide Heart scaled and centered) -->
  <!-- Lucide Heart viewBox is 0 0 24 24. Center is at (12, 12).
       With scale 10.666667, heart size is 256x256.
       Translate to (256 - 12*10.666667, 256 - 12*10.666667) = (128, 128) -->
  <g transform="translate(128, 128) scale(10.666667)">
    <path
      d="M2 9.5a5.5 5.5 0 0 1 9.591-3.676.56.56 0 0 0 .818 0A5.49 5.49 0 0 1 22 9.5c0 2.29-1.5 4-3 5.5l-5.492 5.313a2 2 0 0 1-3 .019L5 15c-1.5-1.5-3-3.2-3-5.5"
      fill="#ffffff"
      stroke="#ffffff"
      stroke-width="1.2"
      stroke-linecap="round"
      stroke-linejoin="round"
    />
  </g>
</svg>
